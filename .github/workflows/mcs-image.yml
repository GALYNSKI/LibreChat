# =============================================================================
# mcs-image — baut das LibreChat-Image dieses Forks und veroeffentlicht es nach
# ghcr.io/galynski/librechat.
#
# Eigener Workflow, bewusst NICHT einer der Upstream-Workflows: die werden bei
# jedem Rebase auf einen neuen Tag mitgezogen, und eine Aenderung darin waere
# ein Konflikt bei jedem Versionswechsel. Diese Datei existiert upstream nicht
# und kann deshalb konfliktfrei mitwandern.
#
# Ausloeser:
#   * Push auf mcs/main   -> Tags: mcs-main, sha-<kurz-sha>
#   * Tag mcs-v*          -> zusaetzlich der Tagname
#   * workflow_dispatch   -> von Hand
#
# Berechtigungen: nur das von GitHub gestellte GITHUB_TOKEN mit packages:write.
# Kein weiteres Secret, keine Zugangsdaten im Repo.
#
# 🔴 EINMALIG VON HAND: Die Sichtbarkeit des Pakets. Der erste Lauf legt es als
#    PRIVAT an. Umstellen unter
#      https://github.com/users/GALYNSKI/packages/container/librechat/settings
#    -> "Danger Zone" -> "Change visibility" -> Public.
#    Ohne das kann der Zielserver das Image nicht ohne Anmeldung ziehen.
# =============================================================================
name: mcs-image

on:
  push:
    branches: [mcs/main]
    tags: ['mcs-v*']
  workflow_dispatch:

concurrency:
  group: mcs-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/librechat

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Quelltext auschecken
        uses: actions/checkout@v4

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An ghcr.io anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Kleinbuchstaben erzwingen: ghcr.io akzeptiert keine Grossbuchstaben im
      # Pfad, der Kontoname ist aber "GALYNSKI".
      - name: Bildnamen normalisieren
        id: name
        run: echo "image=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Tags und Beschriftungen bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=mcs-main,enable=${{ github.ref == 'refs/heads/mcs/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - name: Bauen und veroeffentlichen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.multi
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Der Frontend-Build fordert per Vorgabe 6 GiB Heap. Der
          # GitHub-Runner hat 16 GB RAM, das traegt.
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # 🔴 Der Digest ist der Wert, der in managed-chat-stack gepinnt wird.
      #    Er steht deshalb sowohl in der Zusammenfassung des Laufs als auch
      #    als Job-Output, damit man ihn nicht aus dem Log fischen muss.
      - name: Digest ausgeben
        run: |
          {
            echo "## Image veroeffentlicht"
            echo
            echo '```'
            echo "${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Tags:"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/  - /'
            echo
            echo "In managed-chat-stack/stack/docker-compose.yml eintragen als:"
            echo '```yaml'
            echo "    image: ${{ steps.name.outputs.image }}:mcs-main@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
